name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Check the committed Xcode project matches project.yml
        run: |
          xcodegen generate
          git diff --exit-code -- SpaceStation.xcodeproj SpaceStation/Info.plist

      - name: Build and test
        run: |
          xcodebuild test \
            -project SpaceStation.xcodeproj \
            -scheme SpaceStation \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
