name: SpaceStation
options:
  bundleIdPrefix: com.gregorycarter
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  SpaceStation:
    type: application
    platform: macOS
    sources:
      - path: SpaceStation/Sources
        type: group
      - path: SpaceStation/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: SpaceStation/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpaceStation/SpaceStation.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.gregorycarter.SpaceStation
        PRODUCT_NAME: SpaceStation
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    info:
      path: SpaceStation/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleDisplayName: SpaceStation
        NSHumanReadableCopyright: "Copyright © 2026 Gregory Carter"
    scheme:
      testTargets:
        - SpaceStationTests

  SpaceStationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SpaceStationTests
    dependencies:
      - target: SpaceStation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.gregorycarter.SpaceStationTests
        # The app target is an executable; load it into the test host.
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SpaceStation.app/Contents/MacOS/SpaceStation"
