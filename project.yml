name: SpaceStation
options:
  bundleIdPrefix: com.gregorycarter
  # Marks the project as checked against Xcode 27.1's recommended settings
  # (otherwise Xcode keeps offering "Update to recommended settings").
  xcodeVersion: "2710"
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.9"
    # Xcode's "recommended settings"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # We don't use asset-symbol helpers; recorded as a deliberate choice.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO

targets:
  SpaceStation:
    type: application
    platform: macOS
    sources:
      - path: SpaceStation/Sources
        type: group
      - path: SpaceStation/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: SpaceStation/Info.plist
        CODE_SIGN_ENTITLEMENTS: SpaceStation/SpaceStation.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.gregorycarter.SpaceStation
        PRODUCT_NAME: SpaceStation
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    info:
      path: SpaceStation/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        CFBundleDisplayName: SpaceStation
        NSHumanReadableCopyright: "Copyright © 2026 Gregory Carter"
    scheme:
      testTargets:
        - SpaceStationTests

  SpaceStationTests:
    type: bundle.unit-test
    platform: macOS
    # Host-less: the logic under test is compiled straight into the test bundle, so running
    # the tests never launches the real app (which would touch the user's preferences and
    # macOS permissions).
    sources:
      - path: Tests/SpaceStationTests
      - path: SpaceStation/Sources/SpaceTracker.swift
      - path: SpaceStation/Sources/SpaceSnapshot.swift
      - path: SpaceStation/Sources/AccessibilityController.swift
      - path: SpaceStation/Sources/SpaceSwitchExecutor.swift
      - path: SpaceStation/Sources/SpaceNameRules.swift
      - path: SpaceStation/Sources/SpaceNameManager.swift
      - path: SpaceStation/Sources/SpaceIcon.swift
      - path: SpaceStation/Sources/CodeSigning.swift
      - path: SpaceStation/Sources/HotCorner.swift
      - path: SpaceStation/Sources/SystemShortcuts.swift
      - path: SpaceStation/Sources/SwitcherLayout.swift
      - path: SpaceStation/Sources/MenuBarFormat.swift
      - path: SpaceStation/Sources/AppPreferences.swift
      - path: SpaceStation/Sources/SpaceStepper.swift
      - path: SpaceStation/Sources/SpaceIconImage.swift
      - path: SpaceStation/Sources/SettingsLogic.swift
      - path: SpaceStation/Sources/RenameDraft.swift
      - path: SpaceStation/Sources/StatusItemBadge.swift
      - path: SpaceStation/Sources/UpdateChecker.swift
      - path: SpaceStation/Sources/GlobalHotKey.swift
      - path: SpaceStation/Sources/StatusItemController.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.gregorycarter.SpaceStationTests
